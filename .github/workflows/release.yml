name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run binaries -- --target=bun-linux-x64
      - run: npm run binaries -- --target=bun-darwin-arm64
      - run: npm run binaries -- --target=bun-windows-x64
      - run: sha256sum dist/bin/docbind-* > dist/bin/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/bin/docbind-*"
      - uses: actions/upload-artifact@v4
        with:
          name: docbind-binaries
          path: dist/bin/*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gate
      - run: npm run conformance
      - run: npm run corpus:fixtures
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag dist/bin/*
