name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gate
      - run: npm run corpus:fixtures
      - run: npm run build
      - run: docker build -t docbind:ci .
      - run: docker run --rm docbind:ci --version
