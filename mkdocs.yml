site_name: docbind
site_description: Symbol-level documentation staleness detection
repo_url: https://github.com/vindeckyy/docbind
theme:
  name: readthedocs
nav:
  - Home: index.md
  - Demo: demo.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Scope and limits: scope.md
  - Corpus: corpus.md
  - Precision: precision.md
  - Performance: performance.md
  - Prior art: prior-art.md
markdown_extensions:
  - tables
  - fenced_code
