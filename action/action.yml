name: docbind
description: Report stale symbol references in markdown.
inputs:
  require-coverage:
    description: Minimum verified annotation coverage, 0 to 1. Set to "" to disable.
    required: false
    default: "0.8"
  coverage-ratchet:
    description: Fail when verified coverage regresses against .docbind-coverage.json.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - shell: bash
      env:
        REQUIRE_COVERAGE: ${{ inputs.require-coverage }}
        COVERAGE_RATCHET: ${{ inputs.coverage-ratchet }}
      run: |
        args=(check --sarif docbind.sarif)
        if [ -n "$REQUIRE_COVERAGE" ]; then
          args+=(--require-coverage "$REQUIRE_COVERAGE")
        fi
        if [ "$COVERAGE_RATCHET" = "true" ]; then
          args+=(--coverage-ratchet)
        fi
        npx --yes github:vindeckyy/docbind#v0.6.0 "${args[@]}"
    - uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: docbind.sarif
